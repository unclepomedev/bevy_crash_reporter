name: Release to crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Check version consistency
        shell: bash
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bevy_crash_capture") | .version')
          TAG_VERSION=${GITHUB_REF_NAME#v}

          echo "Crate: $CRATE_VERSION, Tag: $TAG_VERSION"

          if [ "$CRATE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! bevy_crash_capture ($CRATE_VERSION) != Tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Cargo Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -e
          cargo publish --dry-run --locked
          for i in {1..10}; do
            cargo publish --no-verify --locked && exit 0
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Failed to publish after 10 attempts"
          exit 1
