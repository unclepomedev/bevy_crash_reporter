[package]
name = "bevy_crash_reporter"
version = "0.0.1"
edition = "2024"
description = "Standalone crash reporting for Bevy games: capture panics and native crashes, notify configurable backends."
license = "MIT OR Apache-2.0"
repository = "https://github.com/unclepomedev/bevy_crash_reporter"
readme = "README.md"
keywords = ["bevy", "monitoring"]
categories = ["game-development"]

[dependencies]
minidumper-child = "0.5"
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
ureq = { version = "3", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
rfd = { version = "0.17", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
github-issues = ["dep:ureq", "dep:serde"]
confirm-dialog = ["dep:rfd"]

[[bin]]
name = "bevy_crash_trigger"
path = "tests/fixtures/bevy_crash_trigger/main.rs"
test = false
doc = false
